[build]
  command = "pnpm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.19.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["dist/server/**"]

[dev]
  command = "pnpm run dev"
  targetPort = 3000
  port = 8888
